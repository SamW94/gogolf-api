name: Go build and test

on:
  pull_request:
    branches:
      - dev
      - main

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version-file: ./src/go.mod

    - name: Build
      run: go build -v ./src

    - name: Test
      run: go test -v ./src