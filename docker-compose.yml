version: "3.8"

services: 
  db:
    image: postgres:18.0
    container_name: gogolf-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - gogolf_pgdata:/var/lib/postgresql/data

volumes:
  gogolf_pgdata:   